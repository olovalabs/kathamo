[package]
name = "rpi-ai"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rpi-ai"
description = "Unified multi-provider LLM types + streaming, Rust port of pi-ai"
readme = "README.md"
keywords = ["agent", "llm", "ai", "anthropic", "openai"]
categories = ["api-bindings", "asynchronous", "artificial-intelligence"]

[dependencies]
rpi-telemetry = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
memchr = { version = "2", optional = true }
eventsource-stream = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
time = { version = "0.3", optional = true }
crc32fast = { version = "1", optional = true }
flate2 = { version = "1", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
# Real HTTP providers (anthropic). Off by default so core builds remain network-free.
providers = ["dep:reqwest", "dep:bytes", "dep:memchr", "dep:eventsource-stream", "dep:hmac", "dep:sha2", "dep:time", "dep:crc32fast", "dep:flate2"]
# Live network smoke test, gated further by the ANTHROPIC_API_KEY env var at runtime.
smoke = ["providers"]
