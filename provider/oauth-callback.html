<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Kathamo · Sign-in</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(24rem, calc(100% - 4rem)); padding: 1.75rem; }
    header { display: flex; align-items: center; gap: .65rem; font-weight: 650; }
    h1 { margin: 1.25rem 0 .35rem; font-size: 1.5rem; line-height: 1.25; }
    p { margin: 0; }
  </style>
</head>
<body>
  <main>
    <header><img src="data:image/png;base64,__KATHAMO_LOGO__" width="32" height="32" alt="">Kathamo</header>
    <h1 id="title">Sign-in</h1>
    <p id="message" role="status">Return to Kathamo to check your sign-in.</p>
  </main>
  <script id="server-state" type="application/json">__OAUTH_STATE__</script>
  <script>
    const state = JSON.parse(document.getElementById("server-state").textContent);
    document.getElementById("server-state").remove();
    document.getElementById("title").textContent =
      state.ok ? "Sign-in received" : "Sign-in failed";
    document.getElementById("message").textContent = state.ok
      ? "You can close this tab and return to Kathamo to finish."
      : "Return to Kathamo to try signing in again.";
    history.replaceState(null, "", location.pathname);
  </script>
</body>
</html>
